[project]
name = "loup-garou"
version = "0.1.0"
description = "Assistant du maître du jeu pour le Loup-Garou : rôles, compositions équilibrées, animation"
readme = "README.md"
authors = [
    { name = "Julien PETOT", email = "48205834+jpetot@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "jinja2>=3.1.6",
    "pydantic>=2.14.4",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.4",
    "sqlmodel>=0.0.50",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
loup-garou = "loup_garou:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
