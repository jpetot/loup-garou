{% extends "base.html" %}
{% block titre %}Partie n°{{ partie.id }} — Loup-Garou{% endblock %}
{% block contenu %}
<div id="tableau">
  {% include "parties/_tableau.html" %}
</div>
<script>
  document.body.addEventListener("htmx:beforeSwap", () => {
    window.joueursOuverts = [...document.querySelectorAll("details.joueur[open]")].map(d => d.id);
  });
  document.body.addEventListener("htmx:afterSwap", () => {
    (window.joueursOuverts || []).forEach(id => document.getElementById(id)?.setAttribute("open", ""));
  });
</script>
{% endblock %}
