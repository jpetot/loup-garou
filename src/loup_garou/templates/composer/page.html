{% extends "base.html" %}
{% block titre %}Composer — Loup-Garou{% endblock %}
{% block contenu %}
<h1>Composer une partie</h1>
<form hx-post="/composer/generer" hx-target="#resultat">
  <label>
    Nombre de joueurs
    <input type="number" name="joueurs" value="10" min="{{ joueurs_min }}" max="{{ joueurs_max }}" required inputmode="numeric">
  </label>
  <label>
    Expérience du groupe
    <select name="experience">
      {% for valeur, libelle in LIBELLES_EXPERIENCE.items() %}
      <option value="{{ valeur }}" {% if valeur == "confirme" %}selected{% endif %}>{{ libelle }}</option>
      {% endfor %}
    </select>
  </label>
  <label>
    Familiarité entre joueurs
    <select name="familiarite">
      {% for valeur, libelle in LIBELLES_FAMILIARITE.items() %}
      <option value="{{ valeur }}" {% if valeur == 0 %}selected{% endif %}>{{ libelle }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit">Générer</button>
</form>
<div id="resultat"></div>
{% endblock %}
