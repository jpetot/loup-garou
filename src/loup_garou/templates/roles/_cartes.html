<p class="compteur">{{ roles | length }} rôle{{ "s" if roles | length > 1 }}</p>
{% for role in roles %}
<a class="carte camp-{{ role.camp }}" href="/roles/{{ role.id }}">
  <div class="carte-entete">
    <strong>{{ role.nom }}</strong>
    <span class="poids">{{ "%+g" | format(role.poids) }}</span>
  </div>
  <small>{{ LIBELLES_CAMP[role.camp] }} · {{ LIBELLES_NIVEAU[role.niveau] }}</small>
  <p>{{ role.pouvoir }}</p>
</a>
{% else %}
<p>Aucun rôle ne correspond.</p>
{% endfor %}
