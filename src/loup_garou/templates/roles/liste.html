{% extends "base.html" %}
{% block titre %}Rôles — Loup-Garou{% endblock %}
{% block contenu %}
<h1>Rôles</h1>
<form hx-get="/roles" hx-target="#cartes" hx-trigger="input changed delay:250ms from:input, change from:select" hx-push-url="true">
  <input type="search" name="q" value="{{ q }}" placeholder="Rechercher un rôle ou un pouvoir…" aria-label="Recherche">
  <div class="grid">
    <select name="camp" aria-label="Camp">
      <option value="">Tous les camps</option>
      {% for valeur, libelle in LIBELLES_CAMP.items() %}
      <option value="{{ valeur }}" {% if camp == valeur %}selected{% endif %}>{{ libelle }}</option>
      {% endfor %}
    </select>
    <select name="niveau" aria-label="Niveau">
      <option value="">Tous les niveaux</option>
      {% for valeur, libelle in LIBELLES_NIVEAU.items() %}
      <option value="{{ valeur }}" {% if niveau == valeur %}selected{% endif %}>{{ libelle }}</option>
      {% endfor %}
    </select>
  </div>
</form>
<div id="cartes">
  {% include "roles/_cartes.html" %}
</div>
{% endblock %}
